server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: finresearch-api
  datasource:
    # 端口须与 MySQL 的 my.ini 中 port= 一致（常见 3306；若为 3307 请设环境变量 MYSQL_PORT=3307 或用 run-dev.bat）
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:finresearch}?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 55MB

finresearch:
  data-dir: ${DATA_DIR:./data}
  jwt:
    secret: ${JWT_SECRET:change-me-to-a-long-random-secret-key-at-least-256-bits-for-production}
    expiration-ms: 86400000
  encryption:
    key-base64: ${ENCRYPTION_KEY_BASE64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: ${ANTHROPIC_MODEL:claude-sonnet-4-20250514}
  max-tokens: 8192

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.finresearch: INFO
