# 激活方式：SPRING_PROFILES_ACTIVE=h2 或运行 run-dev-h2.bat
# 使用内存库，无需 MySQL；重启后端后数据清空，仅用于本机演示闭环。
#
# 必须覆盖主配置里的 MySQLDialect，否则 Hibernate 不会在 H2 上正确建表（users 表不存在即崩溃）。

spring:
  datasource:
    url: jdbc:h2:mem:finresearch;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
